spring.application.name=smartdesk-desktop
spring.profiles.active=${SMARTDESK_PROFILE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SMARTDESK_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

face.service.base-url=${SMARTDESK_FACE_SERVICE_URL:http://127.0.0.1:5000}
smartdesk.face.dataset-dir=${SMARTDESK_FACE_DATASET_DIR:./desktop-app/dataset}
smartdesk.face.credentials-file=${SMARTDESK_FACE_CREDENTIALS_FILE:${smartdesk.face.dataset-dir}/users.txt}

logging.level.root=INFO