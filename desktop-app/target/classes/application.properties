# Application name
spring.application.name=smartdesk-desktop

# H2 Database (file-based)
spring.datasource.url=jdbc:h2:file:~/smartdeskdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Face microservice
face.service.base-url=http://127.0.0.1:5000
#face.service.api-key=CHANGE_ME

# Cloud placeholders
cloud.provider=local
cloud.firebase.projectId=your-project-id
#cloud.mongodb.uri=mongodb+srv://<user>:<pass>@cluster0.mongodb.net/smartdesk

# Logging
logging.level.root=INFO
